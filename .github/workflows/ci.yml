name: CI

# Runs the checks this repo's own tooling already defines and passes
# locally (`uv run ruff check .`, `uv run mypy ...`, `uv run pytest ...`)
# for both services — not `make lint`/`make test` verbatim, because `make
# lint` also runs `ruff format --check .` and `bandit`, neither of which
# currently pass repo-wide (`ruff format --check .` alone flags 24 files,
# none touched by the passes that added this workflow or forecast-api) —
# enforcing either here would make CI red on unrelated existing code, not
# on anything a given change actually touches. Deliberately left out
# rather than silently "fixed" by reformatting files outside scope; a
# follow-up pass should run `uv run ruff format .` + resolve `bandit`'s
# findings once, then switch this workflow to `make lint`/`make test`
# instead of duplicating their command list here.
#
# forecast-api and services/waerehouse are each their own independent
# `uv` project (own venv/lockfile, not a member of the root workspace) —
# both restructured packages are named `app`, so sharing one workspace
# venv would collide them. Their steps use `uv run --directory
# services/<name>` rather than a root workspace sync. (`services/
# ingestion` is the same shape but isn't wired into this workflow yet —
# a pre-existing gap, not something this change touches.) `services/
# data-pipeline`'s own lint/test steps were removed 2026-08-08 -- that
# service no longer exists on disk (decommissioned in favor of
# ingestion/waerehouse/forecast-api); its history is still in git if
# ever needed (commit `6d0b5cb`).
#
# `warehouse-dbt` is a separate job from `lint`/`test` (README Phase 5's
# "execute dbt test runs against an ephemeral test database") — it needs
# a real Postgres service container to run `dbt seed`/`run`/`test`
# against, which the other two jobs have no reason to pay for.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync root dev tools
        run: uv sync

      - name: Sync forecast-api (independent project)
        run: uv sync --directory services/forecast-api

      - name: Sync warehouse (independent project)
        run: uv sync --directory services/waerehouse

      - name: ruff check (forecast-api)
        run: uv run --directory services/forecast-api ruff check .

      - name: ruff check (warehouse)
        run: uv run --directory services/waerehouse ruff check .

      - name: mypy (forecast-api)
        run: uv run --directory services/forecast-api mypy app

      - name: mypy (warehouse)
        run: uv run --directory services/waerehouse mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync forecast-api (independent project)
        run: uv sync --directory services/forecast-api

      - name: Sync warehouse (independent project)
        run: uv sync --directory services/waerehouse

      - name: pytest (forecast-api)
        run: uv run --directory services/forecast-api pytest -q

      - name: pytest (warehouse)
        run: uv run --directory services/waerehouse pytest -q

  warehouse-dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecolens
          POSTGRES_PASSWORD: ecolens
          POSTGRES_DB: ecolens
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ecolens:ecolens@localhost:5432/ecolens
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync warehouse (independent project)
        run: uv sync --directory services/waerehouse

      - name: Apply raw.* schema migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          ENV_FILE=/dev/null services/waerehouse/scripts/apply-migrations.sh

      - name: dbt seed
        run: uv run --directory services/waerehouse ecolens-warehouse dbt seed

      - name: dbt run
        run: uv run --directory services/waerehouse ecolens-warehouse dbt run

      # Re-run so the 4 incremental fct_* marts (TODO.md Phase 1) actually
      # exercise their `is_incremental()` branch at least once -- on the
      # first run above the relations don't exist yet, so that Jinja
      # block never executes and a syntax/logic error in it would
      # otherwise pass CI silently.
      - name: dbt run (second pass, exercises incremental path)
        run: uv run --directory services/waerehouse ecolens-warehouse dbt run

      - name: dbt test
        run: uv run --directory services/waerehouse ecolens-warehouse dbt test

      # README Phase 4's "Automated Documentation" -- `dbt docs generate`
      # needs a real `dbt run`/`manifest.json` to describe, so this runs
      # after the real seed/run/test above, not standalone. Uploaded as a
      # build artifact (downloadable from the Actions run, `actions/
      # download-artifact` or the UI) rather than published anywhere
      # public -- there's no static-hosting target in this repo to push
      # it to yet, and a self-documenting data dictionary that's one
      # click away from every CI run already closes the real gap (no
      # `dbt docs generate` had ever been run/documented anywhere before
      # this). `dbt docs serve` (a local dev server over these same
      # generated files) is documented in `services/waerehouse/README.md`
      # for local use instead.
      - name: dbt docs generate
        run: uv run --directory services/waerehouse ecolens-warehouse dbt docs generate

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: services/waerehouse/dbt/ecolens/target/
          retention-days: 30
