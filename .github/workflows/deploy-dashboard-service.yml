name: Deploy dashboard service (Vercel)

# Real Vercel deploy trigger for `services/dashboard` -- was an empty
# 0-line placeholder, same as the other 4 `deploy-*.yml` stubs.
#
# `services/ingestion/TODO.md`'s own deployment-plan section names
# Vercel as this service's real target ("`services/dashboard` on
# Vercel"); `services/dashboard/README.md`/`README-FIRST.md` both
# document `vercel deploy --prebuilt` by name as one of several static-
# host options for this app's real `next build` output. Confirmed real
# (`next.config.*` has `output: "export"`, `package.json`'s `build`
# script is a plain `next build`) -- this is a fully static export (every
# real data fetch in this app is client-side `useEffect`/`fetch` against
# the 3 backend services, not a server component doing the fetching), so
# building here and deploying the finished `out/` directory with
# `--prebuilt` is correct, not a shortcut -- Vercel does zero build work
# of its own this way, exactly matching the CLI command the README
# already documents.
#
# Uses Vercel's own official CLI-based GitHub Actions flow (`vercel
# pull` -> `vercel build` -> `vercel deploy --prebuilt`), not the
# third-party `amondnet/vercel-action` -- this is the flow Vercel's own
# docs recommend today. Needs 3 repo secrets (Vercel dashboard -> project
# -> Settings -> General has the org/project IDs; Account Settings ->
# Tokens for the token) -- see docs/runbooks/github-actions-secrets.md:
#   - VERCEL_TOKEN
#   - VERCEL_ORG_ID
#   - VERCEL_PROJECT_ID
#
# Backend API URLs (`NEXT_PUBLIC_INGESTION_API_URL`/`_WAREHOUSE_API_URL`/
# `_FORECAST_API_URL`, `src/lib/env.ts`) are real build-time env vars --
# set them as real Vercel Project env vars (Production environment) in
# the Vercel dashboard, not here; `vercel pull` below pulls them down
# automatically before the build step, same as Vercel's own standard
# flow, so this workflow never needs to know their values itself.

on:
  push:
    branches: ["main"]
    paths:
      - "services/dashboard/**"
      - ".github/workflows/deploy-dashboard-service.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings + env vars (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Real `next build` (this app's own `output: "export"`), driven by
      # Vercel's own build wrapper so the pulled env vars above and the
      # project's framework detection both apply -- not a plain `npm run
      # build` invoked separately.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
