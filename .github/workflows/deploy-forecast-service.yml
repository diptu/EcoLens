name: Deploy forecast-api service (Railway)

# Real Railway deploy trigger for `services/forecast-api` -- was an empty
# 0-line placeholder, same as the other 4 `deploy-*.yml` stubs. Mirrors
# `deploy-ingestion-service.yml`'s own Railway CLI pattern; see that
# file's header comment for the fuller "why Railway builds from the
# Dockerfile directly, why `RAILWAY_TOKEN` alone is enough" reasoning,
# not repeated here.
#
# Two real process roles, both from `infra/docker/forecast-api.Dockerfile`
# (confirmed against `docker-compose.yml`'s own `api`/`train-worker`
# service blocks):
#   - `forecast-api` -- the live inference/registry FastAPI app
#     (`CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port",
#     "8000"]`, the image's own default, no override needed).
#   - `forecast-train-worker` -- the training-trigger RabbitMQ consumer
#     (`docker-compose.yml`'s own comment: "forecast-api's Dockerfile has
#     no ENTRYPOINT... this fully overrides `command:`" -- so this
#     Railway service's start-command override must be the full
#     `ecolens-forecast train-worker`, not a bare subcommand).
#
# **Real operational gap, disclosed not silently assumed**: unlike
# `services/ingestion` (fixed 2026-08-12, see its own TODO.md), neither
# `forecast-api`'s hardcoded `--port 8000` CMD nor `app/core/config.py`'s
# `api_port` reads Railway's `$PORT` env var. Not a hard blocker --
# Railway also supports pointing a service's own "Target Port" setting at
# a fixed container port instead of requiring the app to bind whatever
# `$PORT` it's assigned -- but set `forecast-api`'s Target Port to `8000`
# explicitly in the Railway dashboard rather than assuming the default
# `$PORT`-based routing will work out of the box.
#
# Needs the same `RAILWAY_TOKEN` repo secret `deploy-ingestion-service.yml`
# uses (a Railway *project* token -- reused across every service in that
# project, not a second copy per service). See
# docs/runbooks/github-actions-secrets.md. Both Railway services below
# must already exist in that project (own start-command override, full
# `services/forecast-api/.env.example` env-var set already configured) --
# this workflow only redeploys them, it never creates one.

on:
  push:
    branches: ["main"]
    paths:
      - "services/forecast-api/**"
      - "infra/docker/forecast-api.Dockerfile"
      - ".github/workflows/deploy-forecast-service.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-forecast-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [forecast-api, forecast-train-worker]
    steps:
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error::Missing required repo secret: RAILWAY_TOKEN. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ matrix.service }} --detach
