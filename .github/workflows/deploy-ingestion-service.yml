name: Deploy ingestion service (Railway)

# Real Railway deploy trigger for `services/ingestion` -- the file
# already existed as an empty 0-line placeholder (one of 5 `deploy-
# *.yml` stubs the repo shipped with); this is the first real content.
# See `services/ingestion/TODO.md`'s "Deployment: dockerize + deploy
# standalone on Railway" section for the full plan this implements --
# short version: `infra/docker/ingestion.Dockerfile` already builds all
# 3 real process roles this one image serves, differing only by start
# command (`TODO.md`'s "Option A -- mirror docker-compose 1:1", chosen
# over a Railway-native cron redesign for the first cut). This workflow
# redeploys all 3 on every push to `main` that touches this service's
# own source or its Dockerfile.
#
# Railway builds directly from `infra/docker/ingestion.Dockerfile` on
# each service (each service's own "Dockerfile Path"/"Root Directory"
# build settings, `TODO.md` Phase 3's one-time manual setup -- not
# something this workflow configures) rather than deploying a pre-built
# GHCR image. `docker.yml` doesn't build an `ingestion` image yet
# either (`TODO.md`'s own Phase 2, a separate, not-yet-done gap) -- wiring
# this deploy to depend on that would just be a second unfinished
# prerequisite blocking a working deploy today for no real benefit,
# since Railway's own from-Dockerfile build already gives every push a
# real, freshly-built image with no extra workflow needed.
#
# Needs a real `RAILWAY_TOKEN` repo secret (a Railway *project* token --
# Railway dashboard -> project -> Settings -> Tokens; scopes across every
# service in that project, so one secret covers all 3 below). See
# docs/runbooks/github-actions-secrets.md. The 3 Railway services
# themselves (`ingestion-api`/`ingestion-worker`/`ingestion-beat`) must
# already exist in that project, each with its own start-command
# override and the full `services/ingestion/.env.example` env-var set
# already configured (`TODO.md` Phase 3) -- this workflow only
# redeploys them from the latest `main`, it never creates a service or
# sets its variables.

on:
  push:
    branches: ["main"]
    paths:
      - "services/ingestion/**"
      - "infra/docker/ingestion.Dockerfile"
      - ".github/workflows/deploy-ingestion-service.yml"
  workflow_dispatch: {}

concurrency:
  # Deploys, unlike `docker.yml`'s build-only job, shouldn't cancel an
  # in-flight run out from under itself -- same reasoning `warehouse-
  # monitor.yml` already applies to its own production-effecting job.
  group: deploy-ingestion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One matrix entry per real Railway service `TODO.md`'s Option A
      # topology defines -- same image/repo, only the start command
      # differs (set once, per-service, in Railway itself). Unrelated to
      # each service's own *replica count*: `ingestion-beat` must stay
      # pinned to exactly 1 replica (the sole Celery Beat scheduler) --
      # that's also a one-time Railway-side setting, not controlled by
      # this matrix, which only decides which services this job
      # redeploys.
      fail-fast: false
      matrix:
        service: [ingestion-api, ingestion-worker, ingestion-beat]
    steps:
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error::Missing required repo secret: RAILWAY_TOKEN. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `RAILWAY_TOKEN` alone (a project token) is enough for the CLI
        # to resolve which project/environment this belongs to
        # non-interactively -- no `railway login`/`railway link` step
        # needed first. `--detach` returns as soon as the deploy is
        # accepted rather than streaming build logs to completion; watch
        # the real build/deploy status in the Railway dashboard for the
        # service in question.
        run: railway up --service ${{ matrix.service }} --detach
