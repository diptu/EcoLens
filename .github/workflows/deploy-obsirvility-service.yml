name: Deploy observability stack (self-hosted)

# Real deploy trigger for `services/observility` -- was an empty 0-line
# placeholder, same as the other 4 `deploy-*.yml` stubs. Genuinely
# different shape from the other 3 real deploy workflows in this repo
# (ingestion/forecast-api/warehouse, all single-image Railway services):
# this is a real, stateful multi-container `docker compose up -d` stack
# (Prometheus/Loki/Tempo/Grafana/Alertmanager/OTel Collector/cAdvisor/
# Promtail, `services/observility/docker-compose.yml`) with real
# persistent volumes (`promdata`/`grafana`/etc.) -- not decomposable into
# separate Railway-style single-process services, and its own README
# ("The observability stack should be deployed independently from the
# business services") + TODO.md's own real verification section (`docker
# compose up -d`, real `.env` with `GRAFANA_ADMIN_PASSWORD`/
# `ALERTMANAGER_WEBHOOK_URL` already required to even start) both assume
# a real long-lived host running the compose stack directly, not a
# registry-image-per-service deploy. SSH into that host and re-run
# `docker compose up -d` there is the correct, standard shape for this,
# not a Railway/Vercel-style workflow forced onto a stack that isn't one.
#
# Copies this service's directory to the target host (`appleboy/scp-
# action`) then runs `docker compose pull && docker compose up -d
# --remove-orphans` there (`appleboy/ssh-action`) -- deliberately does
# NOT touch the host's own `.env` (real secrets/retention config already
# living there per `services/observility/.env.example`'s own "copy to
# `.env` before `docker compose up`" instructions -- this workflow only
# ships new compose/config files and restarts the stack against whatever
# `.env` is already on the host, same "this workflow only redeploys, it
# never provisions secrets" boundary the other 3 deploy workflows keep).
#
# Needs 3 repo secrets -- see docs/runbooks/github-actions-secrets.md:
#   - OBSERVABILITY_SSH_HOST
#   - OBSERVABILITY_SSH_USER
#   - OBSERVABILITY_SSH_KEY (private key matching a public key already
#     authorized on that host, e.g. in its `~/.ssh/authorized_keys`)
# The target host needs Docker + the Compose plugin already installed,
# and a real `~/ecolens-observability/.env` already in place (this
# workflow's own `docker compose up -d` step will fail fast against
# `alertmanager-config`'s own `${VAR:?...}` guard if it isn't) -- both
# one-time manual setup, not something this workflow provisions.

on:
  push:
    branches: ["main"]
    paths:
      - "services/observility/**"
      - ".github/workflows/deploy-obsirvility-service.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-observability
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.OBSERVABILITY_SSH_HOST }}" ] && missing+=("OBSERVABILITY_SSH_HOST")
          [ -z "${{ secrets.OBSERVABILITY_SSH_USER }}" ] && missing+=("OBSERVABILITY_SSH_USER")
          [ -z "${{ secrets.OBSERVABILITY_SSH_KEY }}" ] && missing+=("OBSERVABILITY_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      # `strip_components: 2` -- `source` below is `services/observility/`
      # (this checkout's own path prefix); stripping it lands the stack's
      # own files directly under `target` on the host (`docker-compose.yml`
      # at `~/ecolens-observability/docker-compose.yml`, not nested one
      # level deeper) rather than reproducing this repo's own directory
      # structure remotely.
      - name: Copy stack files to the observability host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OBSERVABILITY_SSH_HOST }}
          username: ${{ secrets.OBSERVABILITY_SSH_USER }}
          key: ${{ secrets.OBSERVABILITY_SSH_KEY }}
          source: "services/observility/"
          target: "~/ecolens-observability"
          strip_components: 2

      - name: docker compose up -d (real .env already lives on the host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OBSERVABILITY_SSH_HOST }}
          username: ${{ secrets.OBSERVABILITY_SSH_USER }}
          key: ${{ secrets.OBSERVABILITY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/ecolens-observability
            docker compose pull
            docker compose up -d --remove-orphans
