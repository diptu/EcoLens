name: Deploy warehouse service (Railway)

# Real Railway deploy trigger for `services/waerehouse` -- was an empty
# 0-line placeholder, same as the other 4 `deploy-*.yml` stubs. Mirrors
# `deploy-ingestion-service.yml`'s own Railway CLI pattern; see that
# file's header comment for the fuller "why Railway builds from the
# Dockerfile directly, why `RAILWAY_TOKEN` alone is enough" reasoning,
# not repeated here.
#
# Two real process roles, both from `infra/docker/warehouse.Dockerfile`
# (confirmed against `docker-compose.yml`'s own `warehouse`/`warehouse-
# consumer` service blocks) -- same `ENTRYPOINT ["ecolens-warehouse"]` +
# subcommand-override image ingestion's Dockerfile also uses:
#   - `warehouse-api` -- dbt build control-plane FastAPI app (the image's
#     own default `CMD ["serve"]`, no override needed).
#   - `warehouse-consumer` -- the real `ecolens.landing` RabbitMQ consumer
#     (`raw.*` loader). Start-command override: `ecolens-warehouse
#     consume` (full form, not a bare `consume` -- same "don't rely on
#     the entrypoint being preserved" caution `deploy-ingestion-
#     service.yml`'s own comment already gives for its own worker/beat
#     services).
#
# Deliberately excludes `docker-compose.yml`'s `warehouse-sync` service
# (its own comment: "data-pipeline's own legacy version" of this
# consumer, built from `infra/docker/data-pipeline.Dockerfile` against a
# `services/data-pipeline` source tree that `ci.yml`'s own comment
# confirms no longer exists on disk -- decommissioned, not a real
# deployable target).
#
# **Real operational gap, disclosed not silently assumed**: like
# `forecast-api` (see `deploy-forecast-service.yml`'s own comment),
# `app/core/config.py`'s `api_port` (default `8004`) doesn't read
# Railway's `$PORT` env var either. Set `warehouse-api`'s Railway "Target
# Port" explicitly to `8004` rather than assuming default `$PORT`-based
# routing works.
#
# Needs the same `RAILWAY_TOKEN` repo secret `deploy-ingestion-service.yml`
# uses (a Railway *project* token -- reused across every service in that
# project). See docs/runbooks/github-actions-secrets.md. Both Railway
# services below must already exist in that project (own start-command
# override, full `services/waerehouse/.env.example` env-var set already
# configured) -- this workflow only redeploys them, it never creates one.

on:
  push:
    branches: ["main"]
    paths:
      - "services/waerehouse/**"
      - "infra/docker/warehouse.Dockerfile"
      - ".github/workflows/deploy-waerehouse-service.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-warehouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [warehouse-api, warehouse-consumer]
    steps:
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error::Missing required repo secret: RAILWAY_TOKEN. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ matrix.service }} --detach
