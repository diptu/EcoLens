name: Ingest — AEMO Holidays

# Annual snapshot, not a time-series ingest (task.md). Runs once a year,
# early Jan, plus on-demand via workflow_dispatch with an explicit --year.
# Requires secrets — see docs/runbooks/github-actions-secrets.md.

on:
  schedule:
    - cron: "0 1 2 1 *" # 01:00 UTC, Jan 2nd
  workflow_dispatch:
    inputs:
      year:
        description: "Year to build the holiday calendar for (defaults to current year)"
        required: false
        type: string

concurrency:
  group: ingest-holidays
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$REDIS_URL" ] && missing+=("REDIS_URL")
          [ -z "$S3_ENDPOINT_URL" ] && missing+=("S3_ENDPOINT_URL")
          [ -z "$S3_BUCKET" ] && missing+=("S3_BUCKET")
          [ -z "$S3_ACCESS_KEY" ] && missing+=("S3_ACCESS_KEY")
          [ -z "$S3_SECRET_KEY" ] && missing+=("S3_SECRET_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secrets: ${missing[*]}. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync data-pipeline dependencies
        run: uv sync --package data-pipeline

      - name: Run ingest
        env:
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            uv run --package data-pipeline ecolens-pipeline ingest holidays \
              --year "${{ github.event.inputs.year }}" \
              --triggered-by "$TRIGGERED_BY"
          else
            uv run --package data-pipeline ecolens-pipeline ingest holidays \
              --triggered-by "$TRIGGERED_BY"
          fi
