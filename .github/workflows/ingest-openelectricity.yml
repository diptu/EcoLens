name: Ingest — OpenElectricity

# Cadence per services/data-pipeline/app/service/pipeline/tasks/task.md's
# ingest table: every 5 min. Note GitHub's own scheduling isn't real-time —
# short cron intervals (`*/5`) are the most contended slot on their infra
# and can run late under load. Fine as a free interim scheduler; not a
# guarantee of exact 5-minute cadence.
#
# Requires secrets — see docs/runbooks/github-actions-secrets.md.
# REDIS_URL and S3_* must point at something reachable from a GitHub-hosted
# runner (e.g. Upstash, R2) — a "localhost" value will never work here.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Override the default lookback window (minutes)"
        required: false
        type: string

concurrency:
  group: ingest-openelectricity
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  OE_API_KEY: ${{ secrets.OE_API_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 4 # < the 5-min cadence, so a hung run can't overlap the next tick

    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$REDIS_URL" ] && missing+=("REDIS_URL")
          [ -z "$S3_ENDPOINT_URL" ] && missing+=("S3_ENDPOINT_URL")
          [ -z "$S3_BUCKET" ] && missing+=("S3_BUCKET")
          [ -z "$S3_ACCESS_KEY" ] && missing+=("S3_ACCESS_KEY")
          [ -z "$S3_SECRET_KEY" ] && missing+=("S3_SECRET_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secrets: ${missing[*]}. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync data-pipeline dependencies
        run: uv sync --package data-pipeline

      - name: Run ingest
        env:
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          if [ -n "${{ github.event.inputs.lookback_minutes }}" ]; then
            uv run --package data-pipeline ecolens-pipeline ingest oe \
              --lookback-minutes "${{ github.event.inputs.lookback_minutes }}" \
              --triggered-by "$TRIGGERED_BY"
          else
            uv run --package data-pipeline ecolens-pipeline ingest oe \
              --triggered-by "$TRIGGERED_BY"
          fi
