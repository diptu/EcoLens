name: Warehouse — scheduled monitoring

# Same "GitHub Actions `schedule` as a free interim cron" pattern the
# `ingest-*.yml` workflows already establish (docs/runbooks/github-
# actions-secrets.md) — services/waerehouse/TODO.md's own "prod grade"
# pass, closing the "dbt source freshness never actually wired into a
# cron/CI surface" gap that phase logged.
#
# Deliberately **read-only**: `dbt source freshness` and `check-size`
# only ever report — neither can lose data. `prune`/`export-and-prune`
# (genuinely destructive — they delete rows from raw.*) are NOT wired
# into a schedule here; services/waerehouse/README.md has consistently
# treated when-to-prune as an explicit operator/cron decision, not
# something this workflow should silently automate without being asked
# for that specifically. Run those manually
# (`ecolens-warehouse export-and-prune`) or wire a *separate*, explicitly
# reviewed workflow for them later.
#
# Requires secrets — see docs/runbooks/github-actions-secrets.md
# (DATABASE_URL is the only one either of these 2 commands needs; dbt's
# own POSTGRES_HOST/PORT/USER/PASSWORD/DB are derived from it
# automatically — Settings.dbt_postgres_env's own docstring).

on:
  schedule:
    # Freshness thresholds are minutes-scale (_sources.yml: 15-60min
    # warn_after); hourly is frequent enough to catch a stalled source
    # well within its own error_after window without adding meaningful
    # load. check-size (Settings.database_size_limit_mb, checked at
    # 80%/95%) changes slowly by comparison — riding the same hourly run
    # rather than a separate schedule keeps this to one workflow.
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: warehouse-monitor
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required secrets are configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing required repo secret: DATABASE_URL. See docs/runbooks/github-actions-secrets.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync warehouse (independent project)
        run: uv sync --directory services/waerehouse

      - name: dbt source freshness
        # Non-fatal to the job (dbt's own freshness exit codes conflate
        # "warn" and "error" states in ways worth seeing both of in the
        # log without failing the whole run on a single stale source) --
        # `check-size` below is what actually gates job success/failure.
        continue-on-error: true
        run: uv run --directory services/waerehouse ecolens-warehouse dbt source freshness

      - name: check-size
        run: uv run --directory services/waerehouse ecolens-warehouse check-size

      - name: check-mart-history
        # Exits nonzero (failing this job -- the actual alert, same
        # "a red scheduled Action is the notification" shape ingest-*.yml
        # already uses) if any mart's history regressed since the last
        # check. Needs migration 0003_mart_floor_checks.sql already
        # applied against DATABASE_URL -- a manual `scripts/apply-
        # migrations.sh` run against the real NeonDB, same as every
        # other migration in this project (nothing auto-applies
        # migrations to production yet).
        run: uv run --directory services/waerehouse ecolens-warehouse check-mart-history
