# ─────────────────────────────────────────────────────────────────────────────
# ecoLens — local development stack
# `make up` to start, `make down` to stop, `make logs` to tail.
# ─────────────────────────────────────────────────────────────────────────────
name: ecolens

x-common-env: &common-env
  env_file:
    - .env
  restart: unless-stopped

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    <<: *common-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecolens}
      POSTGRES_USER: ${POSTGRES_USER:-ecolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecolens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecolens} -d ${POSTGRES_DB:-ecolens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Event bus — decouples ingestion from warehousing (overview.md §2) ──────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *common-env
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Cache ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    <<: *common-env
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD --maxmemory 256mb --maxmemory-policy allkeys-lru;
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      "
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Object storage ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    <<: *common-env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET_RAW:-ecolens} || true;
      mc mb -p local/${S3_BUCKET_MODELS:-ecolens}/mlflow || true;
      mc anonymous set none local/${S3_BUCKET_RAW:-ecolens};
      mc anonymous set none local/${S3_BUCKET_MODELS:-ecolens};
      "
    restart: "no"

  # ── MLflow tracking server ────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: infra/docker/mlflow.Dockerfile
    <<: *common-env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-ecolens}:${POSTGRES_PASSWORD:-ecolens}@postgres:5432/${POSTGRES_DB:-ecolens}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER:-ecolens}:${POSTGRES_PASSWORD:-ecolens}@postgres:5432/${POSTGRES_DB:-ecolens}
        --default-artifact-root s3://${S3_BUCKET_MODELS:-ecolens}/mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  # ── Prefect worker ────────────────────────────────────────────────────────
  prefect:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    <<: *common-env
    command: >
      prefect worker start --pool ecolens-pool --type process
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── data-pipeline API (ECO-D49) ──────────────────────────────────────────
  # Headless per README's service-boundary rules — this exists so
  # `/v1/ingest`, `/v1/dbt`, `/v1/data-sources` are actually reachable, not
  # to serve public traffic; it stays off the `edge` network in a real
  # deployment (see `docs/microservices-action-plan.md`), unlike `api`
  # (forecast-api) and `web` below.
  data-pipeline:
    build:
      context: .
      dockerfile: infra/docker/data-pipeline.Dockerfile
    <<: *common-env
    command: serve
    ports:
      - "8001:8001"
    volumes:
      - duckdb_staging:/app/services/data-pipeline/data/staging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Warehouse-sync consumer (overview.md §2) ─────────────────────────────
  # The other half of the raw-landing pipeline: `data-pipeline`'s ingest
  # tasks stage into DuckDB and publish here via RabbitMQ; this is the
  # long-running process that reads those files back out and loads them
  # into Postgres `raw.*`. Same image as `data-pipeline` above, mounting
  # the same `duckdb_staging` volume so both sides see the same files —
  # `command: worker` is the only difference.
  warehouse-sync:
    build:
      context: .
      dockerfile: infra/docker/data-pipeline.Dockerfile
    <<: *common-env
    command: worker
    volumes:
      - duckdb_staging:/app/services/data-pipeline/data/staging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Training-trigger consumer (TODO.md's Event-Driven Pipeline Trigger
  # for Online/Incremental Model Training) ─────────────────────────────────
  # Same image as data-pipeline/warehouse-sync above, `command:
  # train-worker` is the only difference — consumes the
  # `forecasting.training.trigger` queue `pipeline.flows.daily_demand`
  # publishes to after a successful dbt build, running a warm-started
  # incremental fine-tune (`ml.incremental`) per event. `mlflow` is a real
  # dependency here (unlike warehouse-sync, which never touches MLflow),
  # since every incremental run reads/writes the model registry.
  #
  # `deploy.resources.limits` below is item 5's "Dedicated compute/
  # hardware isolation" point, at the scale this repo's plain `docker
  # compose up` (no Kubernetes/swarm) actually runs at: bounding this
  # service's CPU/memory keeps a training run from starving `api`
  # (forecast-api, the live inference path) or `data-pipeline` (the
  # admin API) on the same host. Compose V2 applies `deploy.resources.
  # limits` for plain `compose up`, not only `docker stack deploy` under
  # swarm — real node-pool-level isolation (a separate Kubernetes worker
  # pool with its own hardware) is still out of scope here, same
  # honestly-documented gap `TODO.md` already notes for this item.
  train-worker:
    build:
      context: .
      dockerfile: infra/docker/data-pipeline.Dockerfile
    <<: *common-env
    command: train-worker
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_started

  # ── API (forecast-api) ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/forecast-api.Dockerfile
    <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Web ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/web.Dockerfile
    <<: *common-env
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  # alertmanager.yml.template isn't a real Alertmanager config on its own
  # -- Alertmanager doesn't do `${VAR}` interpolation (see the template's
  # own header comment), so this renders it via `envsubst` into the
  # `alertmanagerconfig` volume before `alertmanager` starts. Same
  # one-shot-init-container pattern `minio-setup` already uses below --
  # not `alertmanager`'s own command, because the official image is a
  # minimal busybox base with no `envsubst` (no `gettext` package) on it.
  alertmanager-config:
    image: alpine:3.20
    <<: *common-env
    volumes:
      - ./infra/alertmanager/alertmanager.yml.template:/template/alertmanager.yml.template:ro
      - alertmanagerconfig:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache gettext >/dev/null && envsubst < /template/alertmanager.yml.template > /config/alertmanager.yml
    restart: "no"

  # infra/prometheus/recording_rules.yml's alert rules route here
  # (Prometheus's own `alerting.alertmanagers` block).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *common-env
    volumes:
      - alertmanagerconfig:/config:ro
      - alertmanagerdata:/alertmanager
    command:
      - --config.file=/config/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  miniodata:
  promdata:
  grafana:
  # Shared between `data-pipeline` and `warehouse-sync` — per-run DuckDB
  # staging files (`Settings.duckdb_staging_dir`) written by the one,
  # read + deleted by the other (`overview.md` §2, `pipeline.duckdb_staging`).
  duckdb_staging:
  # Rendered alertmanager.yml (envsubst output from `alertmanager-config`),
  # handed to `alertmanager` read-only.
  alertmanagerconfig:
  alertmanagerdata:
