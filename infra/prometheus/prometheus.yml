# Scrapes data-pipeline's real GET /metrics (ecolens/api/routers/health.py,
# ecolens/observability/metrics.py) and forecast-api's planned one (not
# implemented yet -- services/forecast-api is an empty scaffold, see
# TODO.md's Forecasting section -- this target will just show as down
# until that exists, which is expected, not a config bug).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: data-pipeline
    metrics_path: /metrics
    static_configs:
      - targets: ["data-pipeline:8001"]

  - job_name: forecast-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
