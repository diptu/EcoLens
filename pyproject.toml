[project]
name = "ecolens"
version = "0.1.0"
description = "ecoLens is a production-grade carbon-footprint platform for Australian energy consumers, analysts, and sustainability teams"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Nazmul Alam", email = "diptunazmulalam@gmail.com" }
]
dependencies = [
    "data-pipeline",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
    "pytest-cov>=7.1.0",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
data-pipeline = { workspace = true }


[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.mypy]
# Set the base for each service
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
# Mypy will now look for packages relative to these directories.
# forecast-api has its own venv + local [tool.mypy] config now (like
# IAM), so it's deliberately not listed here.
mypy_path = [
    "services/data-pipeline"
]

# Tell Mypy to ignore the top-level directory and focus on src/
[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these — safe to ignore rather than pull in
# pandas-stubs / aioboto3-stubs for a service still in early scaffolding.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "pandas.*", "openelectricity.*", "sklearn.*", "croniter.*", "joblib.*", "timesfm.*", "scipy.*"]
ignore_missing_imports = true

[tool.uv.workspace]
# forecast-api deliberately isn't a member anymore -- it now uses its own
# independent venv/lockfile (like IAM), since both it and data-pipeline's
# restructured packages are named `app`, which would collide if both were
# installed into one shared workspace venv.
members = [
    "services/data-pipeline",
]
