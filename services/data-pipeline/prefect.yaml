# Deployment definition for the `daily-demand` flow (Model Operations
# TODO.md Phase 4) -- `app/service/pipeline/flows/__init__.py`'s own
# docstring has said since it was written that "turning it into a
# scheduled deployment is separate, further work"; this is that work.
#
# Applying this (`prefect deploy --all` from this directory) requires a
# reachable `PREFECT_API_URL` and the `ecolens-pool` work pool the
# `prefect` docker-compose service's worker already polls
# (`prefect worker start --pool ecolens-pool --type process`) -- neither
# exists in this dev environment yet (no Prefect server is configured
# anywhere in docker-compose.yml/.env), so this file is real,
# apply-able deployment code, not something that's actually running.
# See TODO.md's Model Operations Phase 4 for that remaining gap.

name: ecolens-data-pipeline
prefect-version: 3.8.1

deployments:
  - name: daily-demand-schedule
    entrypoint: app/service/pipeline/flows/__init__.py:daily_demand
    work_pool:
      name: ecolens-pool
    schedule:
      # Matches the pre-existing "Daily Model Retraining" mock's cron
      # in dashboard's lib/admin-dashboard.ts (`getScheduledOps()`) --
      # once this deployment is real, that mock row should read from
      # this same schedule instead of a hardcoded string.
      cron: "0 2 * * *"
      timezone: "Australia/Sydney"
      active: true
    parameters: {}

  # `todo-model-training.md` Phase 4: "increase trigger frequency...
  # likely a *separate* deployment rather than repurposing daily-demand"
  # -- this is that deployment. Deliberately narrow (dbt build +
  # training-trigger publish only, no ingestion, no full-retrain check --
  # see `incremental_retrain_trigger`'s own docstring for why) and on a
  # much tighter cadence than the once-daily full pipeline above, closing
  # the real gap between real ingestion (`.github/workflows/ingest-*.yml`,
  # 5-30 minute crons) landing new raw data and the mart + incremental
  # fine-tune trigger only refreshing once/day. Same real caveat as
  # `daily-demand-schedule` above: this file is real, apply-able
  # deployment code, not something actually running in this dev
  # environment (no Prefect server configured anywhere in
  # docker-compose.yml/.env yet).
  - name: incremental-retrain-trigger-schedule
    entrypoint: app/service/pipeline/flows/__init__.py:incremental_retrain_trigger
    work_pool:
      name: ecolens-pool
    schedule:
      cron: "0 * * * *" # hourly
      timezone: "Australia/Sydney"
      active: true
    parameters: {}
