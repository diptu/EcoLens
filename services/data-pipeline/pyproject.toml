[project]
name = "data-pipeline"
version = "0.1.0"
description = "ecoLens data-pipeline — the remaining core of the original monolith after services/ingestion (fetch/stage) and services/waerehouse (raw.*/dbt) were extracted into their own standalone services. Owns model training/registry (MLflow), dbt-build orchestration, and the legacy warehouse-sync consumer (Settings.warehouse_sync_consumer_enabled) kept alongside services/waerehouse's own until an operator cuts over."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aioboto3>=13.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0",
    "click>=8.4.2",
    "croniter>=3.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "mlflow>=2.17",
    "openelectricity>=0.11.3",
    "optuna>=4.9.0",
    "pandas>=2.0",
    "prefect>=3.0",
    "prometheus-client>=0.20",
    "pyarrow>=17.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.9",
    "pymongo>=4.17.0",
    "redis>=5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "timesfm[torch]>=2.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ecolens-pipeline = "app.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    # Pinned (not just >=) to match what forecast-api/ingestion/warehouse
    # already pin -- an unpinned `>=0.15.22` resolved to 0.16.1 in this
    # package's own standalone lock (TODO.md's "microservice independence"
    # pass) the moment it stopped sharing the root workspace's lockfile,
    # surfacing 313 new default-rule-set findings that are a ruff-version
    # difference, not a real regression in this code.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
# See services/ingestion/services/waerehouse's own pyproject.toml for why
# this matters: without it, ruff's first-party detection for `app` is
# heuristic and depends on the path shape it's invoked with.
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these -- ported from the root pyproject.toml's
# identical override list (this package's home before this "independently
# deployable" extraction, TODO.md's "microservice independence" pass).
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "pandas.*",
    "openelectricity.*",
    "sklearn.*",
    "croniter.*",
    "joblib.*",
    "timesfm.*",
    "scipy.*",
]
ignore_missing_imports = true
