[project]
name = "data-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aioboto3>=13.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0",
    "click>=8.4.2",
    "croniter>=3.0",
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "mlflow>=2.17",
    "openelectricity>=0.11.3",
    "pandas>=2.0",
    "prefect>=3.0",
    "prometheus-client>=0.20",
    "pyarrow>=17.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.9",
    "pymongo>=4.17.0",
    "redis>=5.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ecolens-pipeline = "app.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
