[project]
name = "forecast-api"
version = "0.1.0"
description = "ecoLens forecast-api: low-latency demand forecast serving over the warehouse's ml_features_demand_v1 mart"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=23.0.0",
    "mlflow-skinny>=2.18.0",
    "numpy>=2.5.1",
    # mlflow-skinny deliberately excludes pandas, but its own
    # mlflow.pytorch submodule (forecasting/loader.py) imports it
    # unconditionally -- without this explicit dep, importing loader.py
    # raises ModuleNotFoundError the moment mlflow.pytorch loads.
    "pandas>=2.2.0",
    # mlflow-skinny also deliberately excludes the SQLAlchemy-backed
    # tracking/registry store -- without these, MlflowClient(tracking_uri=...)
    # can only resolve 'file'/'http'/'https' schemes, and a local
    # 'sqlite:///...' MLFLOW_TRACKING_URI (this service's dev-mode default,
    # sharing data-pipeline's own local MLflow store) fails at startup
    # with "UnsupportedModelRegistryStoreURIException: ... unsupported URI
    # 'sqlite:...'" before ever attempting a connection. This only ever
    # went unnoticed when running inside the monorepo's shared workspace
    # venv, where data-pipeline's own optuna dependency happens to pull
    # sqlalchemy/alembic in transitively -- forecast-api is independently
    # deployable (its own Dockerfile/gunicorn process, own lockfile) and
    # can't rely on a sibling service's unrelated dependency being
    # incidentally co-installed.
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "redis>=5.0.0",
    "torch>=2.5.0",
    "uvicorn>=0.51.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecolens_forecast_api"]
