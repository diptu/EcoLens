[project]
name = "forecast-api"
version = "0.1.0"
description = "ecoLens forecast-api — serves the trained demand-forecast model and derived emissions/footprint reads. Never trains; only loads what data-pipeline registers in MLflow (see README.md's service-boundary rules)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "mlflow>=2.17",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Pinned (not just >=) to match what the rest of the repo currently
    # resolves to: ruff 0.16 changed its no-`select`-config default rule
    # set from ~60 rules to ~416, which would make this service's lint
    # baseline wildly stricter than data-pipeline/IAM's for reasons
    # unrelated to this service's own code.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
# See IAM's pyproject.toml for why this matters: without it, ruff's
# first-party detection for `app` is heuristic and depends on the path
# shape it's invoked with.
known-first-party = ["app"]

[tool.mypy]
# Mirrors what this service was actually checked against pre-restructure
# (the root workspace's shared [tool.mypy], minus warn_return_any -- that
# root config never set it, so turning it on here would surface pre-
# existing "Any" findings as new failures, which isn't this pass's scope.
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these — matches the root workspace's prior
# ignore list for this service.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "joblib.*", "mlflow.*"]
ignore_missing_imports = true
