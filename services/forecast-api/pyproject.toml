[project]
name = "forecast-api"
version = "0.1.0"
description = "ecoLens forecast-api — serves the trained demand-forecast model and derived emissions/footprint reads. Also trains/tunes/evaluates/prunes models as of the data-pipeline training migration (this service's own README.md documents the cutover) — the old \"never trains\" service-boundary rule is retired, not just stale documentation left behind."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "asyncpg>=0.30.0",
    "boto3>=1.34",
    "click>=8.4.2",
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "joblib>=1.4",
    "mlflow>=2.17",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "optuna>=4.9.0",
    "pandas>=2.0",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "timesfm[torch]>=2.0",
    "torch>=2.13.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ecolens-forecast = "app.cli:main"

[dependency-groups]
dev = [
    # notebooks/ (forcast_pipeline.ipynb etc.) -- same versions as
    # ingestion/data-pipeline's identical dev-group entries. Real gap,
    # confirmed live 2026-08-20: this venv's Python never showed up in
    # any Jupyter kernel picker because `ipykernel` was never actually
    # installed here -- every prior notebook "run" in this service was
    # via `uv run python -c ...` snippets, never a real registered
    # kernel.
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Pinned (not just >=) to match what the rest of the repo currently
    # resolves to: ruff 0.16 changed its no-`select`-config default rule
    # set from ~60 rules to ~416, which would make this service's lint
    # baseline wildly stricter than data-pipeline/IAM's for reasons
    # unrelated to this service's own code.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only torch wheels -- this service never runs on GPU infra (Railway/
# Docker Desktop hosts, no CUDA anywhere in this deployment; confirmed
# against docker-compose.yml/README/TODO.md, none mention GPU). Without
# this, `uv sync` resolves PyPI's default Linux torch build, which pulls
# ~2.7GB of unusable nvidia-*/triton CUDA packages as *dependencies* of
# torch itself (torch's own wheel is thin now; the CUDA libs are split
# out) -- the actual majority of `infra/docker/forecast-api.Dockerfile`'s
# image size. `timesfm[torch]`'s own transitive `torch` dependency
# resolves from this same index too (`[tool.uv.sources]` applies per
# package name, not per declaring project).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
# See IAM's pyproject.toml for why this matters: without it, ruff's
# first-party detection for `app` is heuristic and depends on the path
# shape it's invoked with.
known-first-party = ["app"]

[tool.mypy]
# Mirrors what this service was actually checked against pre-restructure
# (the root workspace's shared [tool.mypy], minus warn_return_any -- that
# root config never set it, so turning it on here would surface pre-
# existing "Any" findings as new failures, which isn't this pass's scope.
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these — matches the root workspace's prior
# ignore list for this service, extended with data-pipeline's own
# equivalents (`optuna`/`timesfm`/`scipy`/`croniter`) now that this
# service trains too.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "joblib.*", "mlflow.*", "optuna.*", "timesfm.*", "scipy.*", "boto3.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true
