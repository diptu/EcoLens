[project]
name = "ingestion"
version = "0.1.0"
description = "ecoLens ingestion — standalone extraction of data-pipeline's ingestion half (services/ingestion/TODO.md). Fetches from external providers, flags anomalies, stages in DuckDB, publishes a landed event. Never writes raw.*/runs dbt — that stays warehouse's job (see docs/data/ingestion.md's service-boundary note)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aioboto3>=13.0",
    "asyncpg>=0.30.0",
    "celery>=5.4",
    "click>=8.1",
    "croniter>=3.0",
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "httpx>=0.28",
    "joblib>=1.4",
    "openelectricity>=0.11.3",
    "pandas>=2.0",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.0",
    "pyjwt>=2.9",
    "redis>=5.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ecolens-ingestion = "app.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.14",
    # notebooks/ingestion.ipynb (Phase 1's interactive per-source fetch
    # scratchpad, TODO.md) -- same versions as data-pipeline's identical
    # dev-group entries.
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Pinned (not just >=) to match what the rest of the repo currently
    # resolves to -- same reasoning as forecast-api's own pyproject.toml.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
# See forecast-api/IAM's pyproject.toml for why this matters: without it,
# ruff's first-party detection for `app` is heuristic and depends on the
# path shape it's invoked with.
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openelectricity.*",
    "aioboto3.*",
    "croniter.*",
    "celery.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true
