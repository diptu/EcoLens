# Single-binary Loki, filesystem storage -- matches this stack's local/
# self-hosted framing (no object-store backend configured; swap
# `storage_config`/`common.storage` for S3/GCS before running this at
# real production scale, see TODO.md's Production Hardening section).
#
# `${LOKI_RETENTION_PERIOD}` is expanded by Loki itself at startup
# (`-config.expand-env=true`, set on the `loki` service's `command` in
# docker-compose.yml) -- no separate envsubst init container needed,
# unlike alertmanager.yml.template.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
