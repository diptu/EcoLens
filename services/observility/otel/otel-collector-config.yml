# Traces only -- matches README.md's own architecture diagram exactly:
# metrics flow straight from each service's `/metrics` to Prometheus
# (scrape-based, "Avoiding Observability Spam" section), only traces go
# through this collector on their way to Tempo. No metrics/logs pipeline
# is configured here for that reason, not an oversight.
#
# 2026-08-08: all 3 current business services (ingestion, warehouse,
# forecast-api -- data-pipeline no longer exists) now have real OTel SDK
# instrumentation and point their exporters at this collector when
# `Settings.otel_traces_enabled=True` (opt-in, `False` by default). This
# collector and Tempo behind it were always ready to receive traces;
# that's no longer a gap on their end.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Must run first in the pipeline (OTel Collector's own documented best
  # practice) -- protects this container against unbounded memory growth
  # from a real burst (e.g. a service's batch exporter flushing a large
  # backlog after tracing was toggled on, or `docker-compose.yml`'s
  # `otel-collector` momentarily losing its connection to `tempo`). Soft
  # limit at 80% of `limit_mib` (`spike_limit_mib`) starts refusing new
  # data early -- shedding load gracefully instead of only acting once
  # already at the hard ceiling. 256/64 MiB matches this collector's
  # traces-only, single-small-deployment scope (no metrics/logs pipeline
  # here) -- generous for real trace volume from 3 services, nowhere
  # near what would need a container-level `mem_limit` bump to justify
  # raising it.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Batches spans before forwarding -- README's "Avoiding Observability
  # Spam" > Traces: "The OTel Collector should batch and buffer
  # telemetry before forwarding it."
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Human-readable stdout copy of every span -- useful for `docker
  # compose logs otel-collector` while no service sends real traces yet
  # (see the Known Gap above); drop this exporter from the traces
  # pipeline below once trace volume is non-trivial, it's not meant to
  # run in production at scale.
  debug:
    verbosity: basic

# `:8888/metrics` (this collector's own internal telemetry, scraped by
# prometheus/prometheus.yml's `otel-collector` job) and `:13133/health`
# (README.md's own "Running this stack in production" note: "otel-collector
# has no container-level healthcheck... its :13133/health endpoint is
# available for external monitoring instead") both come from these two
# extensions/telemetry block, not a receiver/exporter.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
