name: "ecolens"
version: "1.0.0"
config-version: 2

profile: "ecolens"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Materializations per docs/data/dbt-commands.md's documented DAG:
# staging = view (cheap, always fresh off raw.*), intermediate = ephemeral
# (inlined into whatever mart references it, never materialized on its
# own — these are feature-engineering CTEs, not something queried
# directly), marts = table (what forecast-api / dashboards actually read,
# so it should be a real table, not recomputed per query).
models:
  ecolens:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

seeds:
  ecolens:
    +schema: seeds
    emissions_factors:
      +column_types:
        intensity_kgco2e_per_mwh: numeric
