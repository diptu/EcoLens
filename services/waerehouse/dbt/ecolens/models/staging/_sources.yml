version: 2

sources:
  - name: raw
    description: >
      Tables landed by the 5 ingestion tasks -- see
      docs/data/ingestion-schema.md for the full column reference and why
      each PK is what it is. Currently landed by whichever of 2 consumers
      picks up a given ecolens.landing message first: this service's own
      app.consumers.landed_events (services/waerehouse/README.md), or
      data-pipeline's legacy pipeline.warehouse_sync (still running until
      an operator flips Settings.warehouse_sync_consumer_enabled off --
      TODO.md Phase 4's cutover switch). Both write the identical raw.*
      shape, so this doesn't affect what a dbt model sees either way.
    schema: raw
    tables:
      - name: aemo_nem_dispatch
        description: 5-minute NEM dispatch, per region.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 30, period: minute }
          error_after: { count: 2, period: hour }
      - name: aemo_wem_dispatch
        description: 30-minute WEM (SWIS) dispatch, single region.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 60, period: minute }
          error_after: { count: 4, period: hour }
      - name: openelectricity_mix
        description: Generation mix, wide form, one row per (ts, network_code, region).
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 15, period: minute }
          error_after: { count: 2, period: hour }
      - name: bom_observations
        description: Weather observations, 6 stations (one per NEM region + WEM).
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 60, period: minute }
          error_after: { count: 4, period: hour }
      - name: aemo_holidays
        description: Annual public-holiday calendar snapshot, per region.
        loaded_at_field: ingested_at
        # No freshness block -- this is an annual snapshot (task.md), not
        # a time series, so "stale" doesn't mean the same thing it does
        # for the other 4 sources.

  - name: meta
    description: >
      Pipeline-operational tables written directly by services/ingestion
      (not landed via the raw.* DuckDB-sync path) -- same NeonDB, same
      DATABASE_URL this project's profile already connects with, so no
      new connection is needed, only a second source schema declaration.
    schema: meta
    tables:
      - name: anomalies
        description: >
          One row per record flagged by services/ingestion's hybrid
          anomaly detector (rule-based + statistical + ML --
          services/ingestion/app/service/pipeline/anomaly.py), written
          directly by that service, not landed through raw.*. No
          first-class ts/region columns -- the flagged record's own
          fields (whichever raw.* table it came from) are captured
          whole in row_snapshot (jsonb); stg_anomalies.sql extracts
          ts/region/network_code back out of it for the 3 sources that
          have them. loaded_at_field intentionally omitted: this table
          is written straight from ingestion's own detector run, not
          through this service's DuckDB-to-Postgres sync, so the
          freshness contract that field implies doesn't apply here the
          same way it does for the raw.* sources above.
