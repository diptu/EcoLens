version: 2

models:
  - name: stg_aemo_nem_dispatch
    description: Thin passthrough over raw.aemo_nem_dispatch.
    columns:
      - name: ts
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NSW1", "QLD1", "VIC1", "SA1", "TAS1"]
      - name: demand_mw
        tests: [not_null]

  - name: stg_aemo_wem_dispatch
    description: Thin passthrough over raw.aemo_wem_dispatch.
    columns:
      - name: ts
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["WEM"]
      - name: demand_mw
        tests: [not_null]

  - name: stg_openelectricity_mix
    description: Thin passthrough over raw.openelectricity_mix.
    columns:
      - name: ts
        tests: [not_null]
      - name: network_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NEM", "WEM"]
      - name: region
        tests: [not_null]

  - name: stg_bom_observations
    description: Thin passthrough over raw.bom_observations.
    columns:
      - name: ts
        tests: [not_null]
      - name: station_id
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NSW1", "QLD1", "VIC1", "SA1", "TAS1", "WEM"]

  - name: stg_aemo_holidays
    description: Thin passthrough over raw.aemo_holidays.
    columns:
      - name: date
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NSW1", "QLD1", "VIC1", "SA1", "TAS1", "WEM"]
      - name: holiday_name
        tests: [not_null]
