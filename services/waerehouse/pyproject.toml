[project]
name = "warehouse"
version = "0.1.0"
description = "ecoLens warehouse — standalone extraction of data-pipeline's warehousing half (services/waerehouse/README.md). Consumes landed events off RabbitMQ, loads staged DuckDB data into Postgres raw.*, enforces the rolling-window retention policy the free-tier Neon plan needs, and runs dbt transforms on top. Never fetches from external providers or stages raw data itself — that stays ingestion's job (see services/ingestion/TODO.md's service-boundary note)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aioboto3>=13.0",
    "asyncpg>=0.30.0",
    "click>=8.1",
    "dbt-postgres>=1.9",
    "duckdb>=1.1",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "pandas>=2.0",
    "prometheus-client>=0.20",
    "pyarrow>=18.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ecolens-warehouse = "app.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.14",
    "mypy>=2.3.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Pinned (not just >=) to match what the rest of the repo currently
    # resolves to -- same reasoning as ingestion/forecast-api's own
    # pyproject.toml.
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.isort]
# See forecast-api/ingestion's pyproject.toml for why this matters:
# without it, ruff's first-party detection for `app` is heuristic and
# depends on the path shape it's invoked with.
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

# No type stubs published for these.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "pyarrow.*", "pandas.*"]
ignore_missing_imports = true
